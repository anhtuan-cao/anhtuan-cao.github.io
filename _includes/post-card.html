{% assign p = include.post %}{% assign c = p.categories | first %}
<a class="pcard" href="{{ p.url }}">
  <span class="pcard-cat cat-{{ c }}">{% include cat-label.html cat=c %}</span>
  <h3>{{ p.title }}</h3>
  {% if p.description %}<p>{{ p.description }}</p>{% endif %}
  <span class="pcard-meta">{{ p.date | date: "%d/%m/%Y" }}{% if p.read_time %} · {{ p.read_time }} <span class="l-en">min read</span><span class="l-vi">phút đọc</span>{% endif %}</span>
</a>
