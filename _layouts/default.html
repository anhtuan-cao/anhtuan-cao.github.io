<!DOCTYPE html>
<html lang="vi" data-lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{% if page.cover %}{{ page.cover }}{% else %}/assets/avatar.jpg{% endif %}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v={{ site.time | date: '%s' }}">
</head>
<body class="{{ page.body_class }}">

{% include nav.html %}

<main>
{{ content }}
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <div>
      <b>Anh Tuan Cao</b><br>
      <span class="l-en">Civil &amp; structural engineer · From Site to Sensor</span><span class="l-vi">Kỹ sư kết cấu · Từ công trường đến cảm biến</span>
    </div>
    <div class="foot-links">
      <a href="mailto:{{ site.author.email }}">Email</a>
      <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="{{ site.author.scholar }}" target="_blank" rel="noopener">Google Scholar</a>
    </div>
  </div>
  <div class="wrap copy">© <span id="yr"></span> Anh Tuan Cao</div>
</footer>

<script src="/script.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
