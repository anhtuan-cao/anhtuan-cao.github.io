<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="So sánh sơ đồ Bottom-up và Top-down" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .dg-v{fill:#fbfaf7}.dg-g{fill:#d9cbb4}.dg-w{fill:#5b6475}.dg-s{fill:#1f5f8b}.dg-st{stroke:#b4541f;stroke-width:5}.dg-k{stroke:#1c2230;stroke-width:3}.dg-t{font-size:15px;font-weight:600;fill:#1c2230}.dg-n{font-size:12px;fill:#5b6475}
    @media (prefers-color-scheme:dark){.dg-t{fill:#e8eaee}.dg-n{fill:#a2a9b6}.dg-g{fill:#4a4234}.dg-v{fill:#12151b}.dg-k{stroke:#e8eaee}}
  </style>
  <text class="dg-t" x="20" y="24">Bottom-up</text>
  <text class="dg-n" x="20" y="42">Đào mở + hệ chống tạm, kết cấu từ đáy lên</text>
  <rect class="dg-g" x="20" y="60" width="320" height="220" rx="6"/>
  <rect class="dg-v" x="60" y="60" width="240" height="170"/>
  <rect class="dg-w" x="52" y="60" width="8" height="200"/><rect class="dg-w" x="300" y="60" width="8" height="200"/>
  <line class="dg-st" x1="60" y1="95" x2="300" y2="95"/><line class="dg-st" x1="60" y1="145" x2="300" y2="145"/><line class="dg-st" x1="60" y1="195" x2="300" y2="195"/>
  <rect class="dg-s" x="60" y="218" width="240" height="12"/>
  <text class="dg-n" x="120" y="88">Thanh chống thép tạm</text>
  <text class="dg-n" x="128" y="250">Móng/sàn đáy đổ trước</text>
  <text class="dg-t" x="380" y="24">Top-down</text>
  <text class="dg-n" x="380" y="42">Sàn hầm làm hệ chống, đào dưới sàn</text>
  <rect class="dg-g" x="380" y="60" width="320" height="220" rx="6"/>
  <rect class="dg-v" x="420" y="60" width="240" height="170"/>
  <rect class="dg-w" x="412" y="60" width="8" height="200"/><rect class="dg-w" x="660" y="60" width="8" height="200"/>
  <rect class="dg-s" x="420" y="60" width="240" height="10"/><rect class="dg-s" x="420" y="120" width="240" height="10"/><rect class="dg-s" x="420" y="180" width="240" height="10"/>
  <rect class="dg-v" x="580" y="60" width="44" height="10"/><rect class="dg-v" x="580" y="120" width="44" height="10"/>
  <line class="dg-k" x1="540" y1="60" x2="540" y2="270"/>
  <text class="dg-n" x="586" y="54">Lỗ mở</text>
  <text class="dg-n" x="440" y="110">Sàn = hệ chống</text>
  <text class="dg-n" x="546" y="250">Kingpost</text>
</svg>
